# TuneLab "Soft" login theme: Keycloak's keycloak.v2 pages and markup,
# restyled to match the web app. Only CSS, one small script and messages.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/tunelab.css
# Dark mode follows the web app's saved choice (see js/tunelab-theme.js),
# so the parent's OS-only dark-mode script is turned off.
darkMode=false
scripts=js/tunelab-theme.js

locales=en,th
